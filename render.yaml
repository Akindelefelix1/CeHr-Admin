services:
  - type: web
    name: cehr-super-admin
    env: static
    plan: free
    branch: staging
    buildCommand: npm ci && VITE_API_BASE_URL=https://new-cehr-be-bkla.onrender.com npm run build -- --mode staging
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://new-cehr-be-bkla.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
